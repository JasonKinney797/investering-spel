<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c18">
  <meta name="description" content="Investor Simulator online: play with 2 to 8 friends on the same stock market.">
  <title>Investor Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="online.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <h1><span class="accent">▸</span> <span id="brand-title">Investor Online</span></h1>
        <p id="dayline"></p>
      </div>
      <div class="stats" id="stats"></div>
    </header>
    <div id="conn" class="conn" hidden></div>
    <div class="progress" id="progress"></div>
    <section class="newsrow" id="newsrow"></section>
    <div class="controlbar" id="controlbar" hidden></div>
    <nav class="tabs" id="tabs" aria-label="Tabs"></nav>
    <main id="main"></main>
    <footer class="foot" id="foot"></footer>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/nl.js"></script>
  <script src="lang/fr.js"></script>
  <script src="lang/es.js"></script>
  <script src="lang/de.js"></script>
  <script src="lang/pt.js"></script>
  <script src="sounds.js"></script>
  <script src="online.js"></script>
</body>
</html>
